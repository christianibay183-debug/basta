<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sentinels</title>

    <!-- TYPEWRITER FONT -->

    <link
        href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap"
        rel="stylesheet">

    <!-- PIXEL/GLITCH FONT -->

    <link
        href="https://db.onlinewebfonts.com/c/de54e55696de4441e90e41503b87bbf0?family=Migration+Sans+ITC+W01+Bold"
        rel="stylesheet">

    <!-- CSS -->

    <link
        
    rel="stylesheet"
    href="../css/login.css?v=2">

</head>

<body>

    <!-- GIF BACKGROUND -->

    <img
        src="../icons/bg.gif"
        class="background-gif">

    <!-- ATMOSPHERIC OVERLAYS -->

    <div class="nightvision"></div>

    <div class="scanlines"></div>

    <div class="vignette"></div>

    <div class="noise"></div>

    <!-- HUD -->

    <div class="rec-hud">

        <div class="rec-dot"></div>

        REC

    </div>

    <!-- MAIN CONTAINER -->

    <div
        class="main-container"
        id="mainContainer">

        <!-- TITLE -->

        <div class="title-container">

            <div class="title-wrapper">

            <img
                src="../icons/logo.png"
                class="title-logo"
                alt="Sentinels Logo">

            <h1 class="title">

                SENTINELS

            </h1>

            <p class="subtitle">

                SURVEILLANCE SYSTEM

            </p>

        </div>

        <!-- LOGIN -->

        <form
            class="login-box"
            id="loginForm"
            method="post"
            action="/login">

            <!-- CSRF Token (hidden) -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="input-group">

                <label>

                    USERNAME

                </label>

                <input
                    type="text"
                    placeholder="ENTER USERNAME"
                    name="username"
                    autocomplete="username">

            </div>

            <div class="input-group">

                <label>

                    PASSWORD

                </label>

                <input
                    type="password"
                    placeholder="••••••••"
                    name="password"
                    autocomplete="current-password">

            </div>

            <button type="submit">

                ENTER SYSTEM

            </button>

            {% if error %}
                <p class="error">{{error}}</p>
            {% endif %}

        </form>

    </div>

    <!-- CLOCK -->

    <div
        class="clock"
        id="clock">

    </div>

    <!-- JS -->

    <script
        src="../js/login.js">

    </script>

</body>
</html>
